[package]
name = "facetql"
version = "0.13.0"
edition = "2024"

[dependencies]
axum = "0.7"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
tower = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
digest = "0.10"
block-buffer = "0.10"
rand = "0.8"
libc = "0.2"
tower-http = { version = "0.5", features = ["cors", "timeout"] }
aes-gcm = "0.10"
native-tls = "0.2"
tokio-native-tls = "0.3"
# RUSTSEC-2024-0357, RUSTSEC-2025-0004 and RUSTSEC-2025-0022 are all fixed
# by 0.10.72; staying on 0.10.x rather than jumping a major keeps the
# vendored-openssl build we already have working.
openssl = "0.10.72"
openssl-sys = { version = "0.9.101", features = ["vendored"] }
indexmap = "2"
# 0.11 pulled in hyper 0.14 + h2 0.3 + rustls 0.21/webpki 0.101 alongside the
# server's own hyper 1.x/h2 0.4 stack — a second, older TLS stack in the same
# binary (see AGENT_LOG.md §4). 0.13 shares the server's hyper 1.x/h2 0.4
# lineage, which also clears RUSTSEC-2026-0258/0098/0099/0104 (the 0.11-side
# h2/rustls-webpki versions had no patched release on their own line).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
