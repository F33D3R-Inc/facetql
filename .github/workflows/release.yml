name: Release

# Builds a native binary on each target OS's own runner — no cross-
# compilation, which is why macOS/Windows/Linux are each real
# GitHub-hosted machines rather than one machine cross-building for
# three targets. Triggers on any tag matching v*, e.g. `git tag v0.3.0
# && git push --tags`. Nothing runs on a normal push to main.
on:
  push:
    tags:
      - "v*"
  # Lets you trigger a build manually from the Actions tab without
  # cutting a tag, useful for testing this workflow itself.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: facetql
            asset_name: facetql-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: facetql
            asset_name: facetql-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: facetql
            asset_name: facetql-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: facetql.exe
            asset_name: facetql-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
